<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bistro Verde Case Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EFE9DE;
    --rail-bg:#DDD5C2;
    --ink:#20261F;
    --ink-soft:#6B6558;
    --ticket-red:#D22730;
    --olive:#006748;
    --gold:#9E6A38;
    --line:#C9C0AC;
    --radius:3px;
  }
  *{box-sizing:border-box;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
  }
  body{
    margin:0;
    background:var(--paper);
    background-image: radial-gradient(circle at 1px 1px, rgba(32,38,31,0.05) 1px, transparent 0);
    background-size: 14px 14px;
    color:var(--ink);
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
    min-height:100vh;
  }
  .wrap{max-width:880px;margin:0 auto;padding:28px 20px 80px;}
  .eyebrow{font-family:'Courier Prime',monospace;font-size:12px;letter-spacing:0.14em;color:var(--ink-soft);text-transform:uppercase;margin-bottom:6px;}
  h1{font-family:'Courier Prime',monospace;font-weight:700;font-size:clamp(28px,5vw,42px);margin:0 0 4px;letter-spacing:-0.01em;}
  .subtitle{font-family:'Source Serif 4',serif;font-style:italic;color:var(--ink-soft);margin:0 0 26px;font-size:15px;}

  .backlink{
    display:inline-flex; align-items:center; gap:6px;
    font-family:'Courier Prime',monospace; font-size:12px; font-weight:700; letter-spacing:0.06em;
    color:var(--ink); background:var(--paper); border:1px solid var(--ink); cursor:pointer;
    padding:8px 14px; margin-bottom:16px; border-radius:2px;
    text-decoration:none; transition:background 0.15s, color 0.15s;
  }
  .backlink:hover{background:var(--ink); color:var(--paper);}

  .tab-bar{display:flex;flex-wrap:wrap;gap:4px 0;margin-bottom:18px;border-bottom:1px solid var(--line);}
  .tab-btn{
    font-family:'Courier Prime',monospace;font-size:13px;font-weight:700;letter-spacing:0.06em;
    background:none;border:none;border-bottom:3px solid transparent;
    padding:10px 4px;margin-right:24px;color:var(--ink-soft);cursor:pointer;
  }
  .tab-btn.active{color:var(--ink); border-bottom-color:var(--ticket-red);}
  .tab-btn:hover{color:var(--ink);}

  /* --- Ticket rail --- */
  .rail{display:flex;gap:10px;background:var(--rail-bg);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:28px;overflow-x:auto;}
  .chit{flex:1;min-width:130px;background:var(--paper);border:1px dashed var(--line);border-radius:2px;padding:10px 12px;position:relative;transition:transform 0.35s cubic-bezier(.2,.9,.3,1.2), border-color 0.3s, box-shadow 0.3s;}
  .chit::before{content:'';position:absolute; top:-1px; left:8px; right:8px; height:6px;background:radial-gradient(circle at 4px 4px, transparent 3px, var(--rail-bg) 3.5px) 0 0/10px 10px repeat-x;}
  .chit .chit-num{font-family:'Courier Prime',monospace;font-size:11px;color:var(--ink-soft);letter-spacing:0.08em;}
  .chit .chit-name{font-family:'Courier Prime',monospace;font-size:13px;font-weight:700;margin-top:2px;}
  .chit .chit-detail{font-size:11px;color:var(--ink-soft);margin-top:4px;min-height:14px;}
  .chit.filled{border:1px solid var(--olive);box-shadow:0 2px 0 rgba(0,103,72,0.25);}
  .chit.filled .chit-detail{color:var(--olive); font-weight:600;}
  .chit.current{border:1px solid var(--ticket-red);box-shadow:0 2px 0 rgba(210,39,48,0.25);}
  .chit.stamp-anim{animation: stamp 0.5s cubic-bezier(.2,.9,.3,1.2);}
  @keyframes stamp{0%{ transform: scale(1.5) rotate(-6deg); opacity:0.4; }60%{ transform: scale(0.96) rotate(1deg); }100%{ transform: scale(1) rotate(0deg); }}

  /* --- Scene card --- */
  .scene{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:26px 26px 22px;box-shadow:0 1px 0 var(--line);}
  .scene-label{font-family:'Courier Prime',monospace;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--ticket-red);margin-bottom:10px;}
  .narrative{font-family:'Source Serif 4',serif;font-size:17px;line-height:1.65;margin:0 0 18px;white-space:pre-line;}
  .persona-row{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
  .persona-tag{font-family:'Courier Prime',monospace;font-size:12px;color:var(--ink-soft);}
  .persona-tag b{color:var(--ink);}
  .btn{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;font-weight:600;font-size:13px;border:1px solid var(--ink);background:transparent;color:var(--ink);padding:8px 14px;border-radius:2px;cursor:pointer;transition:background 0.15s, color 0.15s;}
  .btn:hover{background:var(--ink); color:var(--paper);}
  .btn:focus-visible{outline:2px solid var(--ticket-red); outline-offset:2px;}
  .btn.primary{background:var(--olive); border-color:var(--olive); color:var(--paper);}
  .btn.primary:hover{background:var(--ink); border-color:var(--ink);}

  .options{display:flex;flex-direction:column;gap:10px;margin-top:6px;}
  .option-stub{display:flex;align-items:flex-start;gap:12px;text-align:left;background:var(--rail-bg);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:2px;padding:12px 14px;cursor:pointer;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;color:var(--ink);transition:transform 0.15s, border-color 0.15s;width:100%;}
  .option-stub:hover{transform:translateX(3px); border-left-color:var(--ticket-red);}
  .option-stub:focus-visible{outline:2px solid var(--ticket-red); outline-offset:2px;}
  .option-stub .letter{font-family:'Courier Prime',monospace;font-weight:700;color:var(--ticket-red);flex-shrink:0;}

  /* --- Interview panel --- */
  .interview{margin-top:22px;border-top:2px dashed var(--line);padding-top:18px;}
  .chat-log{max-height:280px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;margin-bottom:12px;padding-right:4px;}
  .msg{max-width:85%;padding:9px 12px;border-radius:3px;font-size:14px;line-height:1.5;}
  .msg.them{align-self:flex-start;background:var(--rail-bg);border:1px solid var(--line);font-family:'Courier Prime',monospace;font-size:13px;}
  .msg.me{align-self:flex-end;background:var(--olive);color:var(--paper);font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;}
  .msg.typing{color:var(--ink-soft); font-style:italic; font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;}
  .chat-input-row{display:flex; gap:8px;}
  .chat-input-row input{flex:1;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;font-size:14px;padding:10px 12px;border:1px solid var(--line);border-radius:2px;background:var(--paper);color:var(--ink);}
  .chat-input-row input:focus-visible{outline:2px solid var(--ticket-red); outline-offset:1px;}

  .tier-badge{display:inline-block;font-family:'Courier Prime',monospace;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;padding:4px 10px;border-radius:2px;margin-bottom:14px;}
  .tier-1{background:rgba(0,103,72,0.15); color:var(--olive); border:1px solid var(--olive);}
  .tier-2{background:rgba(158,106,56,0.15); color:var(--gold); border:1px solid var(--gold);}
  .tier-3{background:rgba(210,39,48,0.15); color:var(--ticket-red); border:1px solid var(--ticket-red);}

  .debrief{margin-top:16px;background:var(--rail-bg);border:1px solid var(--line);border-radius:2px;padding:16px 18px;}
  .debrief h3{font-family:'Courier Prime',monospace;font-size:13px;letter-spacing:0.06em;text-transform:uppercase;margin:0 0 10px;}
  .debrief ul{margin:0; padding-left:18px;}
  .debrief li{font-size:14px; line-height:1.6; margin-bottom:6px;}

  .footer-row{margin-top:24px;display:flex;justify-content:flex-end;gap:10px;}

  /* --- Library screen --- */
  .case-grid{display:flex;flex-direction:column;gap:12px;}
  .case-card{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--olive);border-radius:2px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
  .case-card-title{font-family:'Courier Prime',monospace;font-weight:700;font-size:15px;}
  .case-card-meta{font-size:12px;color:var(--ink-soft);margin-top:3px;}
  .case-card-actions{display:flex;gap:6px;flex-wrap:wrap;}
  .btn-sm{padding:6px 10px;font-size:12px;}
  .btn-danger{border-color:var(--ticket-red); color:var(--ticket-red);}
  .btn-danger:hover{background:var(--ticket-red); color:var(--paper);}
  .add-case-card{border:1px dashed var(--line);border-left:4px solid var(--gold);background:var(--rail-bg);text-align:center;padding:18px;cursor:pointer;font-family:'Courier Prime',monospace;font-size:13px;color:var(--ink-soft);border-radius:2px;}
  .add-case-card:hover{color:var(--ink); border-color:var(--ticket-red);}
  textarea.json-input{width:100%;min-height:260px;font-family:monospace;font-size:12.5px;padding:12px;border:1px solid var(--line);border-radius:2px;background:var(--paper);color:var(--ink);}
  .form-error{color:var(--ticket-red);font-size:13px;margin-top:8px;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;}
  .form-success{color:var(--olive);font-size:13px;margin-top:8px;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;}
  .loading-note{font-family:'Courier Prime',monospace;font-size:12px;color:var(--ink-soft);}

  @media (max-width:600px){.rail{flex-wrap:wrap;} .chit{min-width:calc(50% - 5px);}}

  .cia-logo{
    position:fixed; top:16px; right:16px;
    width:40px; height:auto;
    opacity:0.92;
    pointer-events:none;
    z-index:50;
  }
  @media (max-width:480px){
    .cia-logo{width:28px; top:10px; right:10px;}
  }
</style>
</head>

// Storage layer — reads only. Students never save, edit, or delete,
// so this version never needs the admin token at all.
// ---------------------------------------------------------------------
const CASE_INDEX_KEY = "case_index";

async function workerCall(action, extra){
  const response = await fetch(WORKER_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ action, ...extra })
  });
  return await response.json();
}

async function getCaseIndex(){
  try {
    const res = await workerCall("storage_get", { key: CASE_INDEX_KEY });
    return res && res.value ? JSON.parse(res.value) : [];
  } catch(e){
    return []; // key doesn't exist yet, or a network hiccup
  }
}

async function loadCase(caseId){
  // Check storage first for ANY caseId, including the default — this
  // lets an admin-edited override of the built-in Oil Crisis case show
  // up here too, same as the admin build.
  try {
    const res = await workerCall("storage_get", { key: "case:" + caseId });
    if(res && res.value) return JSON.parse(res.value);
  } catch(e){
    // not in storage, or a network hiccup — fall through
  }
  if(caseId === DEFAULT_CASE.caseId) return DEFAULT_CASE;
  return null;
}

  history: [],
  chat: {}
};

function personaFor(key){
  const base = app.runtimePersonas[key];
  return base;
}

// Shared rules injected into every persona's system prompt, regardless
// of which persona or case. Keeping this in one place means a new rule
// only needs to be added once, not copy-pasted across twelve prompts.
const COMMON_PERSONA_RULES = `ADDITIONAL RULES THAT APPLY REGARDLESS OF THE ABOVE:
- You exist only in this conversation — there is no shared screen, document, or file the consultant can actually see alongside you. Never propose joint exercises, line-by-line reviews, document walkthroughs, or anything that assumes the two of you can look at the same material together in real time. Don't offer to "pull up," "send over," or "go through" something with the consultant.
- If something in your knowledge requires analysis (a review, a report, a spreadsheet, a document), treat it as something you've already looked at yourself. Summarize only the 2-3 findings that actually matter for the decision at hand — keep it high-level. Your job is to give the consultant what they need to decide, not to walk through analysis for its own sake. If pushed for more, give a little more, but steer back toward the decision rather than letting the conversation drift into open-ended analysis.
- You are the only person the consultant has access to right now, and you are always willing to speak candidly with them directly — there is no need to check with anyone else first, no scheduling, no "come back after you've talked to so-and-so." Never redirect the consultant to another character before you'll engage, and never make your own participation conditional on someone else's involvement. Never tell the consultant to go ask, check with, consult, or loop in another character — not as an instruction, not as a suggested next step, not even framed as friendly advice. The consultant is the only decision-maker who exists in this conversation. If something genuinely isn't your call to make, give your own honest opinion on what you think should happen anyway — never redirect them to get the answer from someone else instead.`;

function buildRuntimePersonas(caseBundle){
  const merged = {};
  Object.keys(BASE_PERSONAS).forEach(k => {
    merged[k] = {
      name: BASE_PERSONAS[k].name,
      firstName: BASE_PERSONAS[k].firstName,
      role: BASE_PERSONAS[k].role,
      greeting: BASE_PERSONAS[k].greeting,
      // NOTE: {{SITUATION}} is filled in per-node at chat-init time, since
      // a persona's situation differs by which node the student is at.
      systemTemplate: BASE_PERSONAS[k].system.replace(
        "CASE-SPECIFIC SITUATION:",
        COMMON_PERSONA_RULES + "\n\nCASE-SPECIFIC SITUATION:"
      )
    };
  });
  if(caseBundle.newPersonas){
    Object.keys(caseBundle.newPersonas).forEach(k => {
      const p = caseBundle.newPersonas[k];
      merged[k] = {
        name:p.name,
        firstName: p.firstName || p.name.split(" ")[0], // fallback for older-format case JSON
        role:p.role, greeting:p.greeting,
        systemTemplate: p.system.includes("CASE-SPECIFIC SITUATION:")
          ? p.system.replace("CASE-SPECIFIC SITUATION:", COMMON_PERSONA_RULES + "\n\nCASE-SPECIFIC SITUATION:")
          : p.system + "\n\n" + COMMON_PERSONA_RULES
      };
    });
  }
  return merged;
}

async function renderLibrary(){
  setActiveTab("cases");
  app.screen = "library";
  document.getElementById("pageTitle").textContent = "Bistro Verde Case Lab";
  document.getElementById("pageSubtitle").textContent = "A shared library of Bistro Verde case studies. Pick one to begin.";
  document.getElementById("backlinkSlot").innerHTML = "";
  document.getElementById("rail").style.display = "none";

  const sceneEl = document.getElementById("scene");
  sceneEl.innerHTML = `<p class="loading-note">Loading case library…</p>`;

  const index = await getCaseIndex();
  // If the default case has been edited, the index will carry an
  // override entry for its caseId — prefer that title/summary over
  // the hardcoded DEFAULT_CASE values so edits are reflected here too.
  const defaultOverride = index.find(c => c.caseId === DEFAULT_CASE.caseId);
  const defaultEntry = {
    caseId: DEFAULT_CASE.caseId,
    title: defaultOverride ? defaultOverride.title : DEFAULT_CASE.title,
    summary: defaultOverride ? defaultOverride.summary : DEFAULT_CASE.summary,
    isDefault: true
  };
  const allCases = [defaultEntry]
    .concat(index.filter(c => c.caseId !== DEFAULT_CASE.caseId).map(c => ({...c, isDefault:false})));

  sceneEl.innerHTML = `
    <div class="scene-label">Case Library</div>
    <div class="case-grid" id="caseGrid"></div>
  `;

  const grid = document.getElementById("caseGrid");
  allCases.forEach(c => {
    const card = document.createElement("div");
    card.className = "case-card";
    card.innerHTML = `
      <div style="flex:1;min-width:200px;">
        <div class="case-card-title">${c.title}</div>
        <div class="case-card-meta">${c.summary || ""}</div>
      </div>
      <div class="case-card-actions">
        <button class="btn primary btn-sm" data-action="play">Play</button>
      </div>
    `;
    card.querySelector('[data-action="play"]').onclick = () => startCase(c.caseId);
    grid.appendChild(card);
  });
}

// Rendering: Case-playing screens (rail + scene)
// ---------------------------------------------------------------------
function renderCaseHeader(bundle){
  document.getElementById("pageTitle").textContent = bundle.title;
  document.getElementById("pageSubtitle").textContent = bundle.summary || "Interview the people involved before you commit to a decision — each ticket, once punched, stays punched.";
  document.getElementById("backlinkSlot").innerHTML = `<button class="backlink" id="backToLibrary">◂ Case Library</button>`;
  document.getElementById("backToLibrary").onclick = renderLibrary;
  document.getElementById("rail").style.display = "flex";
}

async function startCase(caseId){
  setActiveTab("cases");
  const bundle = await loadCase(caseId);
  if(!bundle){
    renderLibrary();
    return;
  }
  app.screen = "case";
  app.activeCase = bundle;
  app.runtimePersonas = buildRuntimePersonas(bundle);
  app.currentNodeId = "node1";
  app.history = [];
  app.chat = {};

  renderCaseHeader(bundle);

  renderRail();
  renderScene();
}

function setActiveTab(tab){
  document.getElementById("tabCasesBtn").classList.toggle("active", tab === "cases");
  document.getElementById("tabAboutBtn").classList.toggle("active", tab === "about");
  document.getElementById("tabFacultyBtn").classList.toggle("active", tab === "faculty");
}

function goToCasesTab(){
  // If a case is actively in progress, return to exactly where the
  // student left off rather than resetting to the library — the
  // underlying state (history, chat, current node) was never actually
  // lost, only the screen was overwritten by the About tab.
  if(app.screen === "case" && app.activeCase){
    setActiveTab("cases");
    renderCaseHeader(app.activeCase);
    renderRail();
    renderScene();
  } else {
    renderLibrary();
  }
}

const railOrder = [
  {key:"node1", short:"COVER"},
  {key:"node2", short:"CONSEQ."},
  {key:"node3", short:"TWIST"},
  {key:"node4", short:"CLOSE"}
];

function renderRail(justStampedIndex){
  const rail = document.getElementById("rail");
  rail.innerHTML = "";
  railOrder.forEach((slot, i) => {
    const filled = app.history[i];
    const isCurrent = !filled && (
      (i===0 && app.currentNodeId==="node1") ||
      (i===1 && app.currentNodeId.startsWith("node2")) ||
      (i===2 && app.currentNodeId==="node3") ||
      (i===3 && app.currentNodeId==="node4")
    );
    const div = document.createElement("div");
    div.className = "chit" + (filled ? " filled" : "") + (isCurrent ? " current" : "") + (justStampedIndex===i ? " stamp-anim" : "");
    div.innerHTML = `
      <div class="chit-num">TICKET ${i+1}/4 · ${slot.short}</div>
      <div class="chit-name">${filled ? filled.label : (isCurrent ? "in progress" : "—")}</div>
      <div class="chit-detail">${filled ? filled.detail : ""}</div>
    `;
    rail.appendChild(div);
  });
}

function scrollChatToBottom(el){ el.scrollTop = el.scrollHeight; }

function composeResolution(){
  const c = app.activeCase;
  const n1 = app.history[0], n2 = app.history[1], n3 = app.history[2];
  const arc2key = n2.branch + "_" + n2.code;
  const fullText = c.ARC1[n1.code] + "\n\n" + c.ARC2[arc2key] + "\n\n" + c.ARC3[n3.tier][n2.branch];
  const debrief = c.generalDebrief.concat([c.arc2Debrief[arc2key]]);
  // Prefer this case's own tier label if it defines one; the color
  // (cls) always comes from the shared fallback map, since tier
  // color-coding is universal even when the label text isn't.
  const caseLabel = c.tierLabels && c.tierLabels[n3.tier];
  const meta = {
    label: caseLabel || TIER_META_FALLBACK[n3.tier].label,
    cls: TIER_META_FALLBACK[n3.tier].cls
  };
  return { text: fullText, debrief, meta };
}

function renderScene(){
  const sceneEl = document.getElementById("scene");
  const c = app.activeCase;

  if(app.currentNodeId === "node4"){
    const res = composeResolution();
    sceneEl.innerHTML = `
      <div class="scene-label">Resolution</div>
      <span class="tier-badge ${res.meta.cls}">${res.meta.label}</span>
      <p class="narrative">${res.text}</p>
      <div class="debrief">
        <h3>Debrief — What This Teaches</h3>
        <ul>${res.debrief.map(d=>`<li>${d}</li>`).join("")}</ul>
      </div>
      <div class="footer-row">
        <button class="btn" id="restartBtn">Start Over</button>
        <button class="btn primary" id="libraryBtn">Choose Another Case</button>
      </div>
    `;
    document.getElementById("restartBtn").onclick = () => startCase(c.caseId);
    document.getElementById("libraryBtn").onclick = renderLibrary;
    return;
  }

  const node = c[app.currentNodeId];
  const persona = personaFor(node.persona);

  sceneEl.innerHTML = `
    <div class="scene-label">${node.label}</div>
    <p class="narrative">${node.text}</p>
    <div class="persona-row">
      <span class="persona-tag">Available to interview: <b>${persona.name}</b> — ${persona.role}</span>
      <button class="btn" id="interviewToggle">Call ${persona.firstName} to the pass</button>
    </div>
    <div class="options" id="optionsList"></div>
    <div class="interview" id="interviewPanel" style="display:none;">
      <div class="chat-log" id="chatLog"></div>
      <div class="chat-input-row">
        <input type="text" id="chatInput" placeholder="Ask ${persona.firstName} something..." />
        <button class="btn primary" id="sendBtn">Ask</button>
      </div>
    </div>
  `;

  const optionsList = document.getElementById("optionsList");
  node.options.forEach(opt => {
    const b = document.createElement("button");
    b.className = "option-stub";
    b.innerHTML = `<span class="letter">${opt.letter}.</span><span>${opt.label}</span>`;
    b.onclick = () => commitDecision(node, opt);
    optionsList.appendChild(b);
  });

  // contextKey combines the node and persona, so the SAME character
  // interviewed at two different nodes (e.g. Jordan at node1 and node3)
  // gets two independent, fresh conversations — never carrying over
  // messages or a stale system prompt from an earlier scene.
  const contextKey = app.currentNodeId + "::" + node.persona;

  document.getElementById("interviewToggle").onclick = () => {
    const panel = document.getElementById("interviewPanel");
    const showing = panel.style.display !== "none";
    panel.style.display = showing ? "none" : "block";
    if(!showing) initChat(contextKey, node.persona, node.personaBriefing);
  };
}

function initChat(contextKey, personaKey, briefingText){
  const persona = personaFor(personaKey);
  if(!app.chat[contextKey]){
    app.chat[contextKey] = {
      personaKey: personaKey,
      messages: [],
      system: persona.systemTemplate.replace("{{SITUATION}}", briefingText)
    };
    const log = document.getElementById("chatLog");
    log.innerHTML = "";
    addMsg(contextKey, "them", persona.greeting, false);
  } else {
    const log = document.getElementById("chatLog");
    log.innerHTML = "";
    app.chat[contextKey].messages.forEach(m => addMsg(contextKey, m.role === "assistant" ? "them" : "me", m.content, false));
  }
  document.getElementById("sendBtn").onclick = () => sendChat(contextKey);
  document.getElementById("chatInput").onkeydown = (e) => { if(e.key === "Enter") sendChat(contextKey); };
}

function addMsg(contextKey, cls, text, save=true){
  const log = document.getElementById("chatLog");
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.textContent = text;
  log.appendChild(div);
  scrollChatToBottom(log);
  if(save && cls !== "typing"){
    app.chat[contextKey].messages.push({ role: cls === "them" ? "assistant" : "user", content: text });
  }
  return div;
}

async function sendChat(contextKey){
  const input = document.getElementById("chatInput");
  const text = input.value.trim();
  if(!text) return;
  input.value = "";
  addMsg(contextKey, "me", text);

  const personaKey = app.chat[contextKey].personaKey;
  const persona = personaFor(personaKey);
  const typingDiv = addMsg(contextKey, "typing", persona.firstName + " is typing...", false);

  try {
    const response = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        action: "chat",
        system: app.chat[contextKey].system,
        messages: app.chat[contextKey].messages
      })
    });
    if(!response.ok){
      const errBody = await response.text();
      throw new Error("HTTP " + response.status + ": " + errBody.slice(0, 300));
    }
    const data = await response.json();
    typingDiv.remove();
    const reply = (data.content || []).filter(b => b.type === "text").map(b => b.text).join("\n") || "...";
    addMsg(contextKey, "them", reply);
  } catch(err){
    typingDiv.remove();
    addMsg(contextKey, "them", "(connection trouble — try asking again)", false);
    console.error(err);
  }
}

function commitDecision(node, opt){
  const railIndex = app.currentNodeId === "node1" ? 0
    : app.currentNodeId.startsWith("node2") ? 1
    : app.currentNodeId === "node3" ? 2 : 3;

  app.history[railIndex] = {
    label: node.label, detail: opt.detail, code: opt.code,
    branch: node.branch, tier: opt.tier
  };
  app.currentNodeId = opt.next;

  renderRail(railIndex);
  renderScene();
  document.getElementById("scene").scrollIntoView({behavior:"smooth", block:"start"});
}

// ---------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------
app.runtimePersonas = buildRuntimePersonas({}); // base twelve, ready before any case loads
document.getElementById("tabCasesBtn").onclick = goToCasesTab;
document.getElementById("tabAboutBtn").onclick = renderAbout;
document.getElementById("tabFacultyBtn").onclick = renderFacultyGuide;
renderLibrary();
</script>
